<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%);
        }
        .chat-container {
            height: calc(100vh - 180px);
        }
        .message-bot {
            background-color: #f3f4f6;
            border-radius: 15px 15px 15px 0;
        }
        .message-user {
            background-color: #06b6d4;
            border-radius: 15px 15px 0 15px;
        }
        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .message-animation {
            animation: slideIn 0.3s ease-out forwards;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 3px;
        }
        /* Ajoutez ces styles */
        .options-button {
            transition: all 0.2s ease-in-out;
        }
        
        .options-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-50">
    <header class="gradient-header p-4 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Emma - Votre Conseillère Patrimoniale</h1>
                <p class="text-sm text-gray-200">En ligne</p>
            </div>
        </div>
    </header>

    <div id="chat-messages" class="chat-container flex-1 overflow-y-auto p-4 space-y-4"></div>

    <footer class="p-4 border-t bg-white shadow-lg">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" 
                   id="user-input" 
                   class="flex-1 p-3 border border-gray-300 rounded-xl text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent"
                   placeholder="Posez votre question...">
            <button id="send-button" 
                    class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-2 rounded-xl font-medium transition-colors duration-200 flex items-center gap-2">
                <span>Envoyer</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const API_URL = 'https://chatbot-gdp.onrender.com/api/chat';
        let conversationId = localStorage.getItem('chatConversationId') || `conv_${Date.now()}`;
        const messagesContainer = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // Fonction pour ajouter un message
        function appendMessage(sender, content, options = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message-container';
            messageDiv.className = 'message-container message-animation';
            
            const innerDiv = document.createElement('div');
            innerDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = `p-4 max-w-[80%] ${
                sender === 'user' 
                    ? 'message-user text-white' 
                    : 'message-bot text-gray-800'
            }`;
            
            contentDiv.textContent = content;
            
            // Ajouter les boutons d'options si présents
            if (options && options.length > 0) {
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'mt-3 space-y-2';
                
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.className = 'w-full p-2 text-left hover:bg-cyan-100 rounded-lg border border-cyan-200 transition-colors';
                    button.textContent = option;
                    button.onclick = () => {
                        sendMessage(option);
                        // Désactiver tous les boutons après la sélection
                        optionsDiv.querySelectorAll('button').forEach(btn => {
                            btn.disabled = true;
                            btn.className += ' opacity-50 cursor-not-allowed';
                        });
                    };
                    optionsDiv.appendChild(button);
                });
                
                contentDiv.appendChild(optionsDiv);
            }
            
            innerDiv.appendChild(contentDiv);
            messageDiv.appendChild(innerDiv);
            messagesContainer.appendChild(messageDiv);
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Fonction d'envoi de message
        async function sendMessage(message = null) {  // Ajout du paramètre optionnel
            const messageText = message || userInput.value.trim();
            if (!messageText) return;
        
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;
        
            try {
                appendMessage('user', messageText);
        
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Origin': 'https://doriangdp.github.io'
                    },
                    body: JSON.stringify({
                        question: messageText,
                        conversation_id: conversationId
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.conversation_id) {
                    conversationId = data.conversation_id;
                    localStorage.setItem('chatConversationId', conversationId);
                }
                
                // Modification ici pour gérer correctement la structure de la réponse
                appendMessage('bot', data.reponse || data.content, data.options || []);
                
                // Désactiver l'input si des options sont disponibles
                const hasOptions = data.options && data.options.length > 0;
                userInput.disabled = hasOptions;
                sendButton.disabled = hasOptions;
        
            } catch (error) {
                console.error('Erreur:', error);
                appendMessage(
                    'bot',
                    "Désolé, je rencontre des difficultés techniques. Veuillez réessayer dans quelques instants."
                );
            } finally {
                if (!userInput.disabled) {  // Ne réactive que si pas d'options
                    userInput.disabled = false;
                    sendButton.disabled = false;
                    userInput.focus();
                }
            }
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Message de bienvenue
            appendMessage('bot', "Bonjour ! 👋 Je suis Emma, votre conseillère en gestion de patrimoine. Je suis là pour répondre à vos questions et vous accompagner dans vos projets patrimoniaux. Comment puis-je vous aider aujourd'hui ?");
            
            // Gestionnaire de clic pour le bouton d'envoi
            sendButton.addEventListener('click', sendMessage);
            
            // Gestionnaire de touche Entrée pour l'input
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
