<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%);
        }
        .chat-container {
            height: calc(100vh - 180px);
        }
        .message-bot {
            background-color: #f3f4f6;
            border-radius: 15px 15px 15px 0;
        }
        .message-user {
            background-color: #06b6d4;
            border-radius: 15px 15px 0 15px;
        }
        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .message-animation {
            animation: slideIn 0.3s ease-out forwards;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 3px;
        }
        
        .options-button {
            transition: all 0.2s ease-in-out;
        }
        
        .options-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #f3f4f6;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 2px;
            padding: 12px 16px;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #6B7280;
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing-bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-50">
    <header class="gradient-header p-4 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Emma - Votre Conseillère Patrimoniale</h1>
                <p class="text-sm text-gray-200">En ligne</p>
            </div>
        </div>
    </header>

    <div id="chat-messages" class="chat-container flex-1 overflow-y-auto p-4 space-y-4"></div>

    <footer class="p-4 border-t bg-white shadow-lg">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" 
                   id="user-input" 
                   class="flex-1 p-3 border border-gray-300 rounded-xl text-gray-800 bg-white focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent"
                   placeholder="Posez votre question...">
            <button id="send-button" 
                    class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-2 rounded-xl font-medium transition-colors duration-200 flex items-center gap-2">
                <span>Envoyer</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        // États et configurations
        const API_URL = 'https://chatbot-gdp.onrender.com/api/chat';
        const STORAGE_KEY = 'chatConversationId';
        let conversationId = null;
        
        // Interface utilisateur
        const UI = {
            elements: {
                messagesContainer: document.getElementById('chat-messages'),
                userInput: document.getElementById('user-input'),
                sendButton: document.getElementById('send-button')
            },
        
            createTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message-container message-animation';
                
                const innerDiv = document.createElement('div');
                innerDiv.className = 'flex justify-start';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-bot typing-indicator';
                
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'typing-dot';
                    contentDiv.appendChild(dot);
                }
                
                innerDiv.appendChild(contentDiv);
                typingDiv.appendChild(innerDiv);
                return typingDiv;
            },
        
            appendMessage(sender, content, options = []) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-container message-animation';
                
                const innerDiv = document.createElement('div');
                innerDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = `p-4 max-w-[80%] whitespace-pre-wrap ${
                    sender === 'user' 
                        ? 'message-user text-white' 
                        : 'message-bot text-gray-800'
                }`;
                
                contentDiv.textContent = String(content);
                
                if (options && options.length > 0) {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'mt-3 space-y-2';
                    
                    options.forEach(option => {
                        const button = document.createElement('button');
                        button.className = 'w-full p-2 text-left hover:bg-cyan-100 rounded-lg border border-cyan-200 transition-colors';
                        button.textContent = option;
                        button.onclick = () => {
                            chatOperations.handleOptionClick(option, optionsDiv);
                        };
                        optionsDiv.appendChild(button);
                    });
                    
                    contentDiv.appendChild(optionsDiv);
                }
                
                innerDiv.appendChild(contentDiv);
                messageDiv.appendChild(innerDiv);
                this.elements.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
            },
        
            scrollToBottom() {
                this.elements.messagesContainer.scrollTop = this.elements.messagesContainer.scrollHeight;
            },
        
            setInputState(disabled, options = false) { // Modifié ici
                this.elements.userInput.disabled = disabled;
                this.elements.sendButton.disabled = disabled;
                
                // Si on active l'input, on met le focus
                if (!disabled) {
                    this.elements.userInput.focus();
                }
            },
        
            enableInput() { // Nouvelle méthode
                this.elements.userInput.disabled = false;
                this.elements.sendButton.disabled = false;
                this.elements.userInput.focus();
            },
        
            disableInput() {
                this.elements.userInput.disabled = true;
                this.elements.sendButton.disabled = true;
            },
        
            disableOptions(optionsDiv) {
                optionsDiv.querySelectorAll('button').forEach(btn => {
                    btn.disabled = true;
                    btn.className += ' opacity-50 cursor-not-allowed';
                });
            },
        
            clearInput() {
                this.elements.userInput.value = '';
            }
        }; 
        
        // Opérations du chat
        const chatOperations = {
            initialize() {
                conversationId = this.generateConversationId();
                UI.elements.messagesContainer.innerHTML = '';
                
                UI.appendMessage('bot', 
                    "Bonjour ! 👋 Je suis Emma, votre conseillère en gestion de patrimoine. " +
                    "Je suis là pour répondre à vos questions et vous accompagner dans vos " +
                    "projets patrimoniaux. Comment puis-je vous aider aujourd'hui ?"
                );
                
                UI.enableInput(); // Modifié ici
                localStorage.setItem(STORAGE_KEY, conversationId);
            },
        
            generateConversationId() {
                const timestamp = Date.now();
                const randomStr = Math.random().toString(36).substring(2, 10);
                return `conv_${timestamp}_${randomStr}`;
            },
        
            async sendMessage(message = null) {
                const messageText = message || UI.elements.userInput.value.trim();
                if (!messageText) return;
        
                UI.clearInput();
                UI.disableInput(); // Modifié ici
        
                try {
                    UI.appendMessage('user', messageText);
                    
                    const typingIndicator = UI.createTypingIndicator();
                    UI.elements.messagesContainer.appendChild(typingIndicator);
        
                    const response = await this.callApi(messageText);
                    typingIndicator.remove();
        
                    this.handleApiResponse(response);
                } catch (error) {
                    console.error('Error:', error);
                    typingIndicator?.remove();
                    this.handleError();
                }
            },
        
            async callApi(message) {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Origin': 'https://doriangdp.github.io'
                    },
                    body: JSON.stringify({
                        question: message,
                        conversation_id: conversationId
                    })
                });
        
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return response.json();
            },
        
            handleApiResponse(data) {
                if (data.conversation_id && data.conversation_id !== conversationId) {
                    conversationId = data.conversation_id;
                    localStorage.setItem(STORAGE_KEY, conversationId);
                }
        
                UI.appendMessage('bot', data.content, data.options || []);
                
                // Modifié ici : active l'input sauf si on a des options
                if (!data.options || data.options.length === 0) {
                    UI.enableInput();
                }
            },
        
            handleError() {
                UI.appendMessage('bot', 
                    "Désolé, je rencontre un problème technique. " +
                    "Veuillez réessayer dans quelques instants."
                );
                UI.enableInput(); // Modifié ici
            },
        
            handleOptionClick(option, optionsDiv) {
                UI.(optionsDiv);
                UI.enableInput(); // Ajouté ici
                this.sendMessage(option);
            }
        };
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => chatOperations.initialize());
        
        UI.elements.sendButton.addEventListener('click', () => chatOperations.sendMessage());
        
        UI.elements.userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatOperations.sendMessage();
            }
        });
        
        window.addEventListener('message', (event) => {
            if (event.data === 'chatOpened') {
                chatOperations.initialize();
            }
        });
        
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                conversationId = e.newValue || chatOperations.generateConversationId();
            }
        });
    </script>
</body>
</html>
