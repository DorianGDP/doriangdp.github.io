<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Layout de base */
        .chat-container {
            height: calc(100vh - 140px); /* Réduit la hauteur */
            max-width: 800px; /* Limite la largeur maximale */
            margin: 0 auto; /* Centre le conteneur */
        }

        .header-container {
            height: 64px; /* Hauteur fixe pour l'en-tête */
        }

        .footer-container {
            height: 76px; /* Hauteur fixe pour le pied de page */
        }

        /* Style des messages */
        .message-bot {
            background-color: #f3f4f6;
            border-radius: 15px 15px 15px 0;
            max-width: 85%; /* Limite la largeur des messages */
            margin-bottom: 1rem;
        }

        .message-user {
            background-color: #06b6d4;
            border-radius: 15px 15px 0 15px;
            max-width: 85%;
            margin-left: auto; /* Aligne à droite */
            margin-bottom: 1rem;
        }

        /* Animations */
        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .message-animation {
            animation: slideIn 0.2s ease-out forwards;
        }

        /* Indicateur de frappe */
        .typing-indicator {
            display: inline-flex;
            gap: 2px;
            padding: 8px 12px;
        }
        
        .typing-dot {
            width: 4px;
            height: 4px;
            background-color: #6B7280;
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing-bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-4px); }
        }

        /* Boutons d'options */
        .option-button {
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        
        .option-button:hover:not(:disabled) {
            background-color: #e5e7eb;
            transform: translateY(-1px);
        }
        
        .option-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Scrollbar personnalisée */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #06b6d4 #f3f4f6;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f3f4f6;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #06b6d4;
            border-radius: 2px;
        }

        /* Gradient de l'en-tête */
        .gradient-header {
            background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 100%);
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-50">
    <header class="gradient-header header-container shadow-md">
        <div class="max-w-800px mx-auto h-full px-4 flex items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Emma - Votre Conseillère Patrimoniale</h1>
                    <p class="text-xs text-gray-200">En ligne</p>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 overflow-hidden">
        <div id="chat-messages" class="chat-container custom-scrollbar overflow-y-auto px-4 py-3"></div>
    </div>

    <footer class="footer-container border-t bg-white shadow-md">
        <div class="max-w-800px mx-auto h-full p-4">
            <div class="flex gap-2">
                <input type="text" 
                    id="user-input" 
                    class="flex-1 px-4 py-2 border border-gray-200 rounded-xl text-gray-800 bg-white 
                           focus:outline-none focus:ring-1 focus:ring-cyan-400 focus:border-cyan-400 
                           text-sm"
                    placeholder="Posez votre question...">
                <button id="send-button" 
                        class="bg-cyan-500 hover:bg-cyan-600 text-white px-5 py-2 rounded-xl 
                               font-medium transition-colors duration-200 flex items-center gap-2 
                               text-sm">
                    <span>Envoyer</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <script>
        // Configuration du chat
        const API_URL = 'https://chatbot-gdp.onrender.com/api/chat';
        const STORAGE_KEY = 'chatConversationId';
        const DOM = {
            messagesContainer: document.getElementById('chat-messages'),
            userInput: document.getElementById('user-input'),
            sendButton: document.getElementById('send-button')
        };
        
        // État global du chat
        const chatState = {
            conversationId: null,
            isConversationActive: false,
            lastMessage: null,
            isWaitingForResponse: false
        };
        
        // Helpers pour les IDs et le stockage
        const generateUniqueId = () => {
            const timestamp = Date.now();
            const randomStr = Math.random().toString(36).substring(2, 10);
            return `conv_${timestamp}_${randomStr}`;
        };
        
        // Gestion des messages et de l'interface
        const UI = {
            createTypingIndicator() {
                const template = `
                    <div class="message-container message-animation">
                        <div class="flex justify-start">
                            <div class="message-bot typing-indicator">
                                ${Array(3).fill('<div class="typing-dot"></div>').join('')}
                            </div>
                        </div>
                    </div>
                `;
                const div = document.createElement('div');
                div.innerHTML = template;
                return div.firstElementChild;
            },
        
            appendMessage(sender, content, options = []) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message-container message-animation';
                
                const isUser = sender === 'user';
                const template = `
                    <div class="flex ${isUser ? 'justify-end' : 'justify-start'}">
                        <div class="p-4 max-w-[80%] whitespace-pre-wrap ${
                            isUser ? 'message-user text-white' : 'message-bot text-gray-800'
                        }">
                            ${this.escapeHtml(content)}
                            ${this.createOptionsHtml(options)}
                        </div>
                    </div>
                `;
                
                messageDiv.innerHTML = template;
                DOM.messagesContainer.appendChild(messageDiv);
                this.scrollToBottom();
                
                // Ajouter les événements aux boutons d'options
                if (options.length) {
                    const buttonsDiv = messageDiv.querySelector('.options-container');
                    this.setupOptionsButtons(buttonsDiv, options);
                }
            },
        
            escapeHtml(html) {
                const div = document.createElement('div');
                div.textContent = html;
                return div.innerHTML;
            },
        
            createOptionsHtml(options) {
                if (!options.length) return '';
                return `
                    <div class="options-container mt-3 space-y-2">
                        ${options.map(option => `
                            <button class="w-full p-2 text-left hover:bg-cyan-100 rounded-lg border 
                                    border-cyan-200 transition-colors option-button">
                                ${this.escapeHtml(option)}
                            </button>
                        `).join('')}
                    </div>
                `;
            },
        
            setupOptionsButtons(container, options) {
                if (!container) return;
                const buttons = container.querySelectorAll('.option-button');
                buttons.forEach((button, index) => {
                    button.addEventListener('click', () => {
                        this.handleOptionClick(button, options[index], container);
                    });
                });
            },
        
            handleOptionClick(clickedButton, option, container) {
                // Désactiver tous les boutons
                container.querySelectorAll('.option-button').forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                });
                
                // Envoyer le message sélectionné
                chatOperations.sendMessage(option);
            },
        
            scrollToBottom() {
                DOM.messagesContainer.scrollTop = DOM.messagesContainer.scrollHeight;
            },
        
            setInputState(disabled) {
                DOM.userInput.disabled = disabled;
                DOM.sendButton.disabled = disabled;
            }
        };
        
        // Opérations principales du chat
        const chatOperations = {
            async initialize() {
                chatState.conversationId = generateUniqueId();
                chatState.isConversationActive = false;
                chatState.lastMessage = null;
                
                // Vider le conteneur de messages
                DOM.messagesContainer.innerHTML = '';
                
                // Réinitialiser l'interface
                UI.setInputState(false);
                
                // Afficher le message de bienvenue
                UI.appendMessage('bot', 
                    "Bonjour ! 👋 Je suis Emma, votre conseillère en gestion de patrimoine. " +
                    "Je suis là pour répondre à vos questions et vous accompagner dans vos " +
                    "projets patrimoniaux. Comment puis-je vous aider aujourd'hui ?"
                );
                
                // Focus sur l'input
                DOM.userInput.focus();
                
                // Sauvegarder le nouvel ID
                localStorage.setItem(STORAGE_KEY, chatState.conversationId);
            },
        
            async sendMessage(message = null) {
                const messageText = message || DOM.userInput.value.trim();
                if (!messageText || chatState.isWaitingForResponse) return;
        
                // Nettoyer l'input et désactiver les contrôles
                DOM.userInput.value = '';
                UI.setInputState(true);
                chatState.isWaitingForResponse = true;
        
                try {
                    // Afficher le message utilisateur
                    UI.appendMessage('user', messageText);
                    
                    // Afficher l'indicateur de frappe
                    const typingIndicator = UI.createTypingIndicator();
                    DOM.messagesContainer.appendChild(typingIndicator);
        
                    // Appeler l'API
                    const response = await this.callApi(messageText);
                    chatState.isConversationActive = true;
        
                    // Supprimer l'indicateur de frappe
                    typingIndicator.remove();
        
                    // Traiter la réponse
                    this.handleApiResponse(response);
        
                } catch (error) {
                    console.error('Error:', error);
                    this.handleError();
                } finally {
                    chatState.isWaitingForResponse = false;
                }
            },
        
            async callApi(message) {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Origin': 'https://doriangdp.github.io'
                    },
                    body: JSON.stringify({
                        question: message,
                        conversation_id: chatState.conversationId
                    })
                });
        
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
        
                return response.json();
            },
        
            handleApiResponse(data) {
                // Afficher le message du bot
                UI.appendMessage('bot', data.content, data.options || []);
                
                // Gérer l'état de l'input en fonction des options
                const hasOptions = data.options && data.options.length > 0;
                UI.setInputState(hasOptions);
                
                // Mettre à jour l'ID de conversation si nécessaire
                if (data.conversation_id && data.conversation_id !== chatState.conversationId) {
                    chatState.conversationId = data.conversation_id;
                    localStorage.setItem(STORAGE_KEY, chatState.conversationId);
                }
            },
        
            handleError() {
                UI.appendMessage('bot', 
                    "Désolé, je rencontre un problème technique. " +
                    "Veuillez réessayer dans quelques instants."
                );
                UI.setInputState(false);
            }
        };
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => chatOperations.initialize());
        
        DOM.sendButton.addEventListener('click', () => chatOperations.sendMessage());
        
        DOM.userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatOperations.sendMessage();
            }
        });
        
        window.addEventListener('message', (event) => {
            if (event.data === 'chatOpened') {
                chatOperations.initialize();
            }
        });
        
        // Gérer le reset au rechargement si nécessaire
        window.addEventListener('beforeunload', () => {
            if (chatState.isConversationActive) {
                localStorage.removeItem(STORAGE_KEY);
            }
        });
    </script>
</body>
</html>
